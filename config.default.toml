# Utsushimi の設定の既定値（git に載る。秘密を書かない）。
# 起動時に data/config.toml が無ければ、このファイルを写して作る。主人が変えるのは data/config.toml の方。

[llm]
# ADR 0003：段1は1つのモデルを役割ごとの effort で使い分ける
model = "claude-opus-5-5"
# 対話の effort（low / medium / high / xhigh / max）。このモデルの既定は medium なので明示する
effort = "medium"
max_tokens = 16000
# 呼び先。anthropic は本物の API。fake は API を呼ばずに決まった返事を返す（開発と確かめ用。docs/smoke-test.md）
target = "anthropic"

[creation]
# キャラ作りで広げる連想の数（BH-41）。多いほど、生まれるキャラがゆらぐ
associations = 5

[memory]
# 1日の区切りの時刻（HH:MM）。この時刻をまたいだら前の日の日記を書く（BH-15）
day_start = "00:00"

[context]
# 文脈の上限（文字数）。超えたら昔の発言 → 日記 → 今日の会話の古い方の順に削る（BH-17）
limit = 30000
