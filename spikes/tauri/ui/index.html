<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: #2b2b33; color: #ddd; font: 13px sans-serif; overflow: hidden; }
  #wrap { box-sizing: border-box; height: 100%; padding: 8px 12px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
  #bar { height: 22px; display: flex; align-items: center; }
  #bar span { flex: 1; pointer-events: none; }
  #bar button { width: 22px; height: 22px; padding: 0; }
  #log { flex: 1; overflow: auto; background: #1e1e24; padding: 4px; }
  #row { height: 24px; display: flex; gap: 4px; }
  #row input { flex: 1; }
</style></head>
<body><div id="wrap">
  <div id="bar" data-tauri-drag-region><span>相棒（spike）</span><button id="close">×</button></div>
  <div id="log"></div>
  <div id="row"><input id="input"><button id="send">送信</button></div>
</div>
<script>
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;
const EDGE = 8;
const $ = (id) => document.getElementById(id);
const add = (role, text) => { const d = document.createElement('div'); d.textContent = `${role}: ${text}`; $('log').appendChild(d); };
let busy = false, last = 0, maxgap = 0, ticker = null;

document.addEventListener('pointerdown', (e) => {
  const x = Math.round(e.clientX), y = Math.round(e.clientY), w = innerWidth, h = innerHeight;
  if (x < EDGE || y < EDGE || x >= w - EDGE || y >= h - EDGE) {
    invoke('log_event', { msg: `poke edge ${x} ${y}` });
    e.preventDefault(); e.stopPropagation();
  } else {
    invoke('log_event', { msg: `click inner ${x} ${y}` });
  }
}, true);

$('close').onclick = () => invoke('hide_window');

async function send() {
  const text = $('input').value.trim();
  if (!text || busy) return;
  $('input').value = '';
  await invoke('persist_send', { text });
  add('user', text);
  busy = true; maxgap = 0; last = performance.now();
  ticker = setInterval(() => { const n = performance.now(); maxgap = Math.max(maxgap, n - last); last = n; }, 20);
}
$('send').onclick = send;
$('input').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

listen('bg-done', async () => {
  clearInterval(ticker);
  await invoke('bg_end', { maxgap: Math.round(maxgap), input: $('input').value });
  add('assistant', '（返事）');
  busy = false;
});

(async () => {
  const cfg = await invoke('boot');
  for (const [role, text] of cfg.rows) add(role, text);
  $('input').focus();
  if (cfg.auto_send) { $('input').value = cfg.auto_send; setTimeout(send, 200); }
})();
</script></body></html>
