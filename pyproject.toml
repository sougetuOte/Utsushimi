[project]
name = "utsushimi"
version = "0.1.0"
description = "人格を持ち、記憶を引き継ぐ、Windows 常駐のテキスト・デスクトップ相棒"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "anthropic>=1.8.0",
    "PySide6>=6.11.2",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"
